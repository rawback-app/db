name: Build

# The only place the image is actually built before a release: build it and
# run the smoke test, without pushing. Path-filtered to conserve Actions quota.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - initdb/**
      - scripts/**
      - test/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        # Builder state is removed at job end; no remote cache is exported.
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Build image
        uses: docker/build-push-action@v7
        env:
          # Build records are persistent Actions artifacts.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rawback-db:ci

      - name: Smoke test
        run: test/smoke.sh rawback-db:ci
